# Doc 08 §4.3 spatial transfer region — generated by
# hydrocascade.experiments.transfer.write_region_config.
#
# To run the transfer test:
#   hydrocascade aoi dem flow network units projection traveltime \
#       rainfall catalog --config config/region_maharashtra.yaml
#   hydrocascade transfer --config config/region_maharashtra.yaml
#
# The fitted parameters are NOT refitted. That is the test.
# Needs roughly 1.5-2.5 GB of free disk for the second DEM.

project:
  name: hydrocascade
  seed: 20260904
region:
  id: maharashtra_transfer
  description: "Northern Western Ghats transfer region for the Doc 08 \xA74.3 spatial\
    \ transfer test. Derived hydrologically from the seed point, exactly as the Chaliyar\
    \ pilot is. Coordinates for Malin, Taliye and Irshalwadi are NOT sourced yet \u2014\
    \ see experiments/transfer.py."
  seed_bbox:
  - 72.9
  - 18.3
  - 74.1
  - 19.7
  seed_point:
    lat: 19.15
    lon: 73.65
    name: Northern Western Ghats transfer seed
  hydrobasins_level: 8
  buffer_km: 10.0
crs:
  analysis: EPSG:32643
  storage: EPSG:4326
period:
  start: '2018-06-01'
  end: '2024-12-31'
  holdout_start: '2024-06-01'
landmarks:
  transfer_seed:
    lat: 19.15
    lon: 73.65
    note: placeholder; replace with sourced event coordinates
catalog:
  dedup:
    distance_m: 500
    days: 1
    hazard_types:
    - L
  crown_convention: highest_elevation
  completeness:
    min_area_m2: null
    n_bins: 40
floods:
  return_periods:
  - 2
  - 5
  - 20
  threshold_return_period: 2
  decluster_days: 3
  min_contributing_area_km2: 50
  min_years_for_gumbel: 20
spatial:
  dem:
    source: copernicus_glo30
    resolution_m: 30
  flow:
    fill_method: priority_flood
    channel_threshold_km2: 1.0
  slope_units:
    target_median_area_km2: 0.25
    min_area_km2: 0.02
  network:
    reach_length_m: 500
  travel_time:
    celerity_exponent: 0.3
    v0_reference_ms: 9.0
    v0_min_ms: 4.5
    celerity_physical_range_ms:
    - 1.0
    - 5.0
    min_slope: 0.0001
    max_reference_hours: 48
rainfall:
  primary: chirps
  chirps_resolution: p25
  windows_days:
  - 1
  - 3
  - 7
  - 15
  - 30
  api:
    decay_k: 0.9
data_mode:
  glofas: synthetic
  era5_land: unused
  sentinel1: unavailable
  landslides: real
  chirps: real
  dem: real
  hydrosheds: real
  worldcover: real
  soilgrids: real
